[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsd"
version = "0.1.0"
description = "A minimal terminal checklist for assignments, fed by .ics calendars and source plugins."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joey Ruan" }]
keywords = ["tui", "calendar", "ics", "assignments", "checklist", "gradescope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = ["beautifulsoup4>=4.12"]

[project.urls]
Homepage = "https://github.com/jlrsh/gsd"
Repository = "https://github.com/jlrsh/gsd"
Issues = "https://github.com/jlrsh/gsd/issues"

[project.scripts]
gsd = "gsd.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["gsd"]

[tool.hatch.build.targets.sdist]
include = ["/gsd", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
