name: GSD
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GSDCore:
    path: GSDCore
targets:
  GSD:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - package: GSDCore
        product: GSDCore
      - target: GSDWidgets
    entitlements:
      path: iOS/GSD.entitlements
      properties:
        com.apple.security.application-groups:
          - $(GSD_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: GSD
        PRODUCT_BUNDLE_IDENTIFIER: $(GSD_BUNDLE_ID)
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
  GSDWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/GSDWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(GSD_APP_GROUP)
    settings:
      base:
        PRODUCT_NAME: GSDWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(GSD_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
  GSDMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
    dependencies:
      - package: GSDCore
        product: GSDCore
    settings:
      base:
        PRODUCT_NAME: GSD
        PRODUCT_BUNDLE_IDENTIFIER: $(GSD_BUNDLE_ID).mac
        INFOPLIST_FILE: Mac/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  GSD:
    build:
      targets:
        GSD: all
    run:
      config: Debug
    archive:
      config: Release
  GSDMac:
    build:
      targets:
        GSDMac: all
    run:
      config: Debug
    archive:
      config: Release
